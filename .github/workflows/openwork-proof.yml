name: CARE OpenWork + Family Guarantee proof

on:
  pull_request:
    paths:
      - 'openwork/**'
      - 'family/**'
      - 'engine/openwork_engine.py'
      - 'engine/family_guarantee.py'
      - 'engine/family_fiscal_model.py'
      - 'tests/test_openwork.py'
      - 'tests/test_family_guarantee.py'
      - 'tests/test_family_fiscal_model.py'
      - 'data/openwork_funding_sources.json'
      - 'data/family_baselines_2026.json'
      - 'docs/OPENWORK*'
      - 'docs/FAMILY_GUARANTEE*'
      - 'agents/openwork_funding_watch.md'
      - 'agents/family_safety_watch.md'
      - '.github/workflows/openwork-proof.yml'
  workflow_dispatch:

concurrency:
  group: care-guarantees-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile deterministic engines
        run: python -m compileall -q engine/openwork_engine.py engine/family_guarantee.py engine/family_fiscal_model.py openwork/simulate.py family/simulate.py
      - name: Run OpenWork guarantee tests
        run: python -m pytest -q tests/test_openwork.py
      - name: Run Family Guarantee tests
        run: python -m pytest -q tests/test_family_guarantee.py tests/test_family_fiscal_model.py
      - name: Run end-to-end simulators
        run: |
          python openwork/simulate.py
          python family/simulate.py
      - name: Validate registries
        run: |
          python -m json.tool data/openwork_funding_sources.json >/dev/null
          python -m json.tool data/family_baselines_2026.json >/dev/null
      - name: Assert worker-facing guarantees
        run: |
          grep -q 'PAY GUARANTEED' openwork/index.html
          grep -q '€20–24/h' openwork/index.html
          grep -q 'Payroll liquidity' openwork/index.html
      - name: Assert family-facing guarantees
        run: |
          grep -q 'Kein Kind' family/index.html
          grep -q '€259' family/index.html
          grep -q '35%+' family/index.html
          grep -q 'policy prototype' family/index.html
