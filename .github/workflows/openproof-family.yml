name: CARE OpenProof family
on:
  pull_request:
    paths:
      - 'proof/openproof_family.py'
      - 'tests/test_openproof_family.py'
      - 'docs/OPENPROOF_FAMILY.md'
      - '.github/workflows/openproof-family.yml'
  push:
    branches: [main]
    paths:
      - 'proof/openproof_family.py'
      - 'tests/test_openproof_family.py'
      - '.github/workflows/openproof-family.yml'
permissions:
  contents: read
jobs:
  family-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_openproof_family.py
