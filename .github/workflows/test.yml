name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Run ZERO end-to-end demo
        run: python scripts/zero_demo.py > /tmp/zero-demo.json
